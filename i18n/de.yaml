- id: "story_quote"
  translation: "„Seit meiner Kindheit ist der Klang der Bienen Musik für mich. Die Linde vor unserem Haus war voller Bienen, wenn sie blühte — und dieser Klang erfreut noch heute meine Seele.“"
- id: "story_summary"
  translation: "Von einem Dorf mit jahrhundertealter Imkertradition über akademische Ausbildung bei einem führenden Varroa-Experten bis zur zertifizierten naturnahen Imkerei in Norwegen mit Basis in Bergen. Die Imkerei ist meine Familientradition."
