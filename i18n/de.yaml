- id: "story_quote"
  translation: "„Seit meiner Kindheit ist der Klang der Bienen Musik für mich. Die Linde vor unserem Haus war voller Bienen, wenn sie blühte — und dieser Klang erfreut noch heute meine Seele.“"
- id: "story_summary"
  translation: "Von einem Dorf mit jahrhundertealter Imkertradition über akademische Ausbildung bei einem führenden Varroa-Experten bis zum zertifizierten Imker in Norwegen mit Basis in Bergen, der naturnahe Methoden anwendet, wo es möglich ist. Die Imkerei ist meine Familientradition."
