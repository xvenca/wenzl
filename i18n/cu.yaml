  translation: "Природьноє пчеларьство въ Бергенѣ — древѧныѥ ульи, иже самъ рꙋкама сотворихъ, пчелы своими пꙋтьми живꙋтъ. Родовоє прѣданиѥ изъ земли чешьскыя, иде же гербъ пластъ медовый носить."
