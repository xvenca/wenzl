- id: "story_quote"
  translation: "«Отъ дѣтиньства гласъ пчелъ ми бѣ музыка. Липа предъ домомъ нашимъ полна бѣ пчелъ, єгда цвѣтѣаше — и той гласъ и нынѣ веселитъ дꙋшꙋ мою.»"
- id: "story_summary"
  translation: "Отъ села съ многолѣтньѥю пчеларьскѫ традициѭ, чрезъ книжноє оучениѥ оу ведꙋщаго мужа о варроа, до оувѣдѣнаго пчеларя въ Норьвѣгии съ основаниѥмъ въ Бергенѣ, иже природьны способы дѣетъ, идеже мощьно. Пчеларьство єсть родоваѧ традициѧ моѧ."
