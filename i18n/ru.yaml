- id: "story_quote"
  translation: "«С детства звук пчёл был для меня музыкой. Липа перед нашим домом наполнялась пчёлами, когда зацветала — и этот звук до сих пор радует мою душу.»"
- id: "story_summary"
  translation: "От деревни с многовековой пчеловодческой традицией, через академическое обучение у ведущего специалиста по варроатозу, к сертифицированному пчеловоду в Норвегии с базой в Бергене, применяющему природные методы там, где это возможно. Пчеловодство — моя семейная традиция."
