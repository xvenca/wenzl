- id: "story_quote"
  translation: "„Od dzieciństwa dźwięk pszczół był dla mnie muzyką. Lipa przed naszym domem wypełniała się pszczołami, gdy zakwitała — i ten dźwięk do dziś cieszy moją duszę.”"
- id: "story_summary"
  translation: "Od wsi z wielowiekową tradycją pszczelarską, przez akademicką naukę u czołowego specjalisty od warrozy, po certyfikowanego pszczelarza w Norwegii z bazą w Bergen, który stosuje naturalne metody tam, gdzie to możliwe. Pszczelarstwo to moja rodzinna tradycja."
