- id: "story_quote"
  translation: "«Від дитинства звук бджіл для мене був музикою. Липа перед нашим будинком наповнювалася бджолами, коли розквітала — і цей звук досі тішить мою душу.»"
- id: "story_summary"
  translation: "Від села зі столітньою бджолярською традицією, через академічне навчання у провідного фахівця з вароатозу, до сертифікованого бджоляра в Норвегії з базою в Бергені, який застосовує природні методи там, де це можливо. Бджільництво — моя родинна традиція."
