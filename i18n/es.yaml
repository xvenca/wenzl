- id: "story_quote"
  translation: '"Desde la infancia, el sonido de las abejas ha sido música para mí. El tilo frente a nuestra casa se llenaba de abejas cuando florecía — ese sonido todavía alegra mi alma."'
- id: "story_summary"
  translation: "De un pueblo con siglos de tradición apícola, pasando por una formación académica con un destacado experto en varroa, hasta un apicultor certificado en Noruega con base en Bergen que aplica métodos naturales siempre que es posible. La apicultura es mi tradición familiar."
