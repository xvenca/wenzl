name: CI — Build Hugo site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build site (hugo --minify)
        run: |
          hugo --minify

      - name: Verify build directory exists
        run: |
          if [ -d public ]; then echo "public exists"; ls -la public | sed -n '1,20p'; else echo "public missing"; exit 1; fi

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start Hugo dev server
        run: |
          hugo server --port 1313 --disableFastRender &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1313 > /dev/null 2>&1; then
              echo "Hugo server ready"
              break
            fi
            sleep 1
          done

      - name: Take page screenshots
        run: node .github/scripts/screenshot.js

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Push screenshots to ci-screenshots branch
        id: push_screenshots
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_DIR="pr${{ github.event.pull_request.number }}"
          WORK=$(mktemp -d)
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code "$REPO_URL" "refs/heads/ci-screenshots" > /dev/null 2>&1; then
            git clone --branch ci-screenshots --depth 1 "$REPO_URL" "$WORK"
            cd "$WORK"
          else
            git clone --depth 1 "$REPO_URL" "$WORK"
            cd "$WORK"
            git checkout --orphan ci-screenshots
            git rm -rf . --quiet 2>/dev/null || true
            git commit --allow-empty -m "init: ci-screenshots branch"
            git push origin ci-screenshots
          fi

          rm -rf "$PR_DIR"
          mkdir -p "$PR_DIR"
          cp "$GITHUB_WORKSPACE/screenshots"/*.png "$PR_DIR/"

          git add "$PR_DIR/"
          git commit --allow-empty -m "ci: screenshots for PR ${{ github.event.pull_request.number }}, run ${{ github.run_id }}"
          git push origin ci-screenshots
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with screenshot gallery
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNum = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.push_screenshots.outputs.sha }}';
            const baseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/pr${prNum}`;

            const LANGS = ['en','cs','de','pl','ru','uk','es','cu'];
            const LANG_NAMES = {
              no: '🇳🇴 Norwegian', en: '🇬🇧 English', cs: '🇨🇿 Czech',
              de: '🇩🇪 German',   pl: '🇵🇱 Polish',  ru: '🇷🇺 Russian',
              uk: '🇺🇦 Ukrainian', es: '🇪🇸 Spanish', cu: '☦️ Church Slavonic'
            };

            function getLang(name) {
              for (const l of LANGS) {
                if (name === l || name.startsWith(l + '-')) return l;
              }
              return 'no';
            }

            const files = fs.readdirSync('screenshots')
              .filter(f => f.endsWith('.png')).sort();

            const byLang = {};
            for (const f of files) {
              const lang = getLang(f.replace('.png', ''));
              (byLang[lang] = byLang[lang] || []).push(f);
            }

            let body = `## Page screenshots (${files.length} pages)\n\n`;
            for (const lang of ['no', ...LANGS]) {
              if (!byLang[lang]) continue;
              const pages = byLang[lang];
              body += `<details><summary>${LANG_NAMES[lang]} — ${pages.length} pages</summary>\n\n`;
              for (const f of pages) {
                const name = f.replace('.png', '');
                body += `**${name}**\n![${name}](${baseUrl}/${f})\n\n`;
              }
              body += `</details>\n\n`;
            }

            await github.rest.issues.createComment({
              issue_number: prNum,
              owner,
              repo,
              body,
            });
