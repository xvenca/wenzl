name: CI — Build Hugo site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Build site (hugo --minify)
        run: |
          hugo --minify

      - name: Verify build directory exists
        run: |
          if [ -d public ]; then echo "public exists"; ls -la public | sed -n '1,20p'; else echo "public missing"; exit 1; fi
