name: CI — Build Hugo site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build site (hugo --minify)
        run: |
          hugo --minify

      - name: Verify build directory exists
        run: |
          if [ -d public ]; then echo "public exists"; ls -la public | sed -n '1,20p'; else echo "public missing"; exit 1; fi

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start Hugo dev server
        run: |
          hugo server --port 1313 --disableFastRender &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1313 > /dev/null 2>&1; then
              echo "Hugo server ready"
              break
            fi
            sleep 1
          done

      - name: Take page screenshots
        run: node .github/scripts/screenshot.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Comment on PR with screenshot link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Page screenshots',
              '',
              `Screenshots of key pages captured during this CI run — [download from Actions](${runUrl}#artifacts).`,
              '',
              '| Page | File |',
              '|------|------|',
              '| Norwegian home | `no-home.png` |',
              '| Swarms | `no-swarms.png` |',
              '| Hives | `no-hives.png` |',
              '| Pollinators | `no-pollinators.png` |',
              '| About (NO) | `no-about.png` |',
              '| Membership | `no-membership.png` |',
              '| English home | `en-home.png` |',
              '| Czech home | `cs-home.png` |',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
