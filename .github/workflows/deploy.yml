name: Deploy to FTP host

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build
        run: hugo --minify

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: wenzl.no
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          # domene.no serves this account from /public_html/ (same content was also visible under /www/).
          server-dir: /public_html/

      - name: Refresh Facebook OG cache
        run: |
          sleep 20
          TOKEN="${{ secrets.FB_ACCESS_TOKEN }}"
          AUTH=""
          [ -n "$TOKEN" ] && AUTH="&access_token=${TOKEN}"

          INDEX=$(curl -s https://wenzl.no/sitemap.xml)
          if echo "$INDEX" | grep -q '<sitemapindex'; then
            CHILDREN=$(echo "$INDEX" | grep '<loc>' | sed 's/.*<loc>//;s/<\/loc>.*//')
            URLS=""
            for child in $CHILDREN; do
              CHILD_XML=$(curl -s "$child")
              URLS="$URLS $(echo "$CHILD_XML" | grep '<loc>' | sed 's/.*<loc>//;s/<\/loc>.*//')"
            done
          else
            URLS=$(echo "$INDEX" | grep '<loc>' | sed 's/.*<loc>//;s/<\/loc>.*//')
          fi

          COUNT=0
          for url in $URLS; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://graph.facebook.com/?id=${url}&scrape=true${AUTH}")
            echo "${CODE} ${url}"
            COUNT=$((COUNT + 1))
          done
          echo "Refreshed ${COUNT} URLs"
