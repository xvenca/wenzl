{{ define "main" }}
  <section>
    <h1 class="text-3xl font-bold mb-4">{{ .Title }}</h1>
    <p class="text-gray-700 mb-6">{{ with .Description }}{{ . }}{{ else }}{{ i18n "terms_listing" | default "Listing of terms." }}{{ end }}</p>

    <ul class="grid gap-4 md:grid-cols-2">
      {{ range .Data.Terms.Alphabetical }}
      <li>
        <div class="p-4 border rounded">
          <a href="{{ .Page.RelPermalink }}" class="text-green-800 font-semibold">{{ .Term }}</a>
          <p class="text-sm text-gray-600">{{ .Count }} {{ i18n "pages_word" | default "pages" }}</p>
        </div>
      </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
