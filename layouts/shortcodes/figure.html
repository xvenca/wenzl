{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $caption := .Get "caption" }}
<figure class="my-6">
  <img src="{{ $src }}" alt="{{ $alt }}" class="w-full rounded shadow">
  {{ if $caption }}
  <figcaption class="text-sm text-gray-600 mt-2">{{ $caption }}</figcaption>
  {{ end }}
</figure>
