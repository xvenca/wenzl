{{ $c := site.Data.contact }}
<div class="contact-block">
  <p><strong>Email:</strong> <a href="mailto:{{ $c.email }}">{{ $c.email }}</a></p>
  <p><strong>Phone:</strong> <a href="tel:{{ $c.phone }}">{{ $c.phone }}</a></p>
  <p><strong>Location:</strong> {{ $c.address }}</p>
  {{ with $c.notes }}<p class="text-sm text-gray-600">{{ . }}</p>{{ end }}
  {{ with $c.cta }}<p class="mt-2 font-semibold">{{ . }}</p>{{ end }}
</div>
